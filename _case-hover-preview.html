<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  html,body{margin:0;background:#fff;}
  .stage{width:312px;height:248px;position:relative;overflow:visible;}
  .stage .case-card{position:relative;width:312px;height:248px;flex:none;display:block;}
  /* force hover for screenshotting */
  .force .case-card__img::before{transform:scale(1.2)!important;}
  .force .case-card__img::after{opacity:1!important;}
  .force .case-card__badge{opacity:0!important;}
  .force .case-card__badge--hover{opacity:1!important;}
</style></head>
<body>
<div class="stage" id="stage">
  <a class="case-card" href="#" style="--case-art: url('assets/case-1.png')">
    <span class="case-card__img"></span>
    <img class="case-card__badge" src="assets/case-badge.svg" alt="">
    <img class="case-card__badge case-card__badge--hover" src="assets/case-badge-hover.svg" alt="">
    <div class="case-card__body">
      <img src="assets/case-book.svg" alt="">
      <p>Provide the best service with out of the box ideas</p>
    </div>
  </a>
</div>
<script>
  if (location.hash === '#hover') document.getElementById('stage').classList.add('force');
</script>
</body></html>
