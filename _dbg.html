<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>
html,body{margin:0;background:#fff}
.warm{width:312px;height:248px;background:url('assets/case-1.png') 50% 50%/100% 100% no-repeat}
.stage{width:312px;height:248px;position:relative}
.stage .case-card{position:relative;width:312px;height:248px;flex:none;display:block}
.force .case-card__img::before{transform:scale(1.2)!important}
.force .case-card__img::after{opacity:1!important}
.force .case-card__badge{opacity:0!important}
.force .case-card__badge--hover{opacity:1!important}
</style></head><body>
<div class="warm"></div>
<div class="stage"><a class="case-card" href="#" style="--case-art: url('assets/case-1.png')">
  <span class="case-card__img"></span>
  <img class="case-card__badge" src="assets/case-badge.svg" alt="">
  <img class="case-card__badge case-card__badge--hover" src="assets/case-badge-hover.svg" alt="">
  <div class="case-card__body"><img src="assets/case-book.svg" alt=""><p>Provide the best service with out of the box ideas</p></div>
</a></div>
<div class="stage force"><a class="case-card" href="#" style="--case-art: url('assets/case-1.png')">
  <span class="case-card__img"></span>
  <img class="case-card__badge" src="assets/case-badge.svg" alt="">
  <img class="case-card__badge case-card__badge--hover" src="assets/case-badge-hover.svg" alt="">
  <div class="case-card__body"><img src="assets/case-book.svg" alt=""><p>Provide the best service with out of the box ideas</p></div>
</a></div>
</body></html>
